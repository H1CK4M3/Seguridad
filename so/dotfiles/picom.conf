#=====================================================
# DEV/OS - Picom Config
# Redondeo de esquinas y sombras suaves
#=====================================================

# --- Backend ---
backend = "xrender";
vsync = true;
unredir-if-possible = true;

# --- Sombras ---
shadow = true;
shadow-radius = 8;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.4;
shadow-exclude = [
    "class_g = 'Dunst'",
    "name = 'Notification'"
];

# --- Transparencias ---
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;

# --- Desvanecimiento (Fading) ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# --- Redondeo de esquinas ---
rounded-corners = true;
corner-radius = 12;
round-borders = 1;

# Excluir solo las notificaciones del redondeo
# (Polybar SÍ debe ser redondeada por Picom)
rounded-corners-exclude = [
    "class_g = 'Dunst'"
];

# --- Exclusión de opacidad ---
opacity-rule = [
    "100:class_g = 'Polybar'"
];
