;=====================================================
; DEV/OS - Polybar Config
; 7 barras superiores + 1 inferior, sin radius propio
; El redondeo lo hace Picom
;=====================================================

[colors]
bg = #D3D3D3
fg = #2E2E2E
fg-alt = #5A5A5A
alert = #C0392B
separator = #888888

;=====================================================
; BARRA IZQUIERDA (Fecha y Hora)
;=====================================================
[bar/izquierda]
width = 11%
height = 32
offset-x = 0.5%
offset-y = 4
bottom = false
fixed-center = false
radius = 0.0
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = FiraCode Nerd Font:size=10;2
modules-center = date
enable-ipc = true
wm-restack = bspwm

;=====================================================
; BARRA TASKBAR (Letras de Apps)
;=====================================================
[bar/taskbar]
width = 28%
height = 32
offset-x = 12%
offset-y = 4
bottom = false
fixed-center = false
radius = 0.0
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = FiraCode Nerd Font:size=10;2
modules-center = taskbar
enable-ipc = true
wm-restack = bspwm
underline-size = 3

;=====================================================
; BARRA CENTRAL (Workspaces)
;=====================================================
[bar/centro]
width = 14%
height = 32
offset-x = 40.5%
offset-y = 4
bottom = false
fixed-center = false
radius = 0.0
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = FiraCode Nerd Font:size=10;2
modules-center = workspaces
enable-ipc = true
wm-restack = bspwm
underline-size = 3

;=====================================================
; BARRA DERECHA (Sysinfo + Systray)
;=====================================================
[bar/derecha]
width = 20%
height = 32
offset-x = 55%
offset-y = 4
bottom = false
fixed-center = false
radius = 0.0
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = FiraCode Nerd Font:size=10;2
modules-center = sysinfo tray
enable-ipc = true
wm-restack = bspwm

;=====================================================
; BARRA VOLUMEN
;=====================================================
[bar/volumen]
width = 9%
height = 32
offset-x = 75.5%
offset-y = 4
bottom = false
fixed-center = false
radius = 0.0
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = FiraCode Nerd Font:size=10;2
modules-center = volume
enable-ipc = true
wm-restack = bspwm

;=====================================================
; BARRA USB
;=====================================================
[bar/usb]
width = 14.5%
height = 32
offset-x = 85%
offset-y = 4
bottom = false
fixed-center = false
radius = 0.0
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = FiraCode Nerd Font:size=10;2
modules-center = usb
enable-ipc = true
wm-restack = bspwm

;=====================================================
; BARRA INFERIOR (Red)
;=====================================================
[bar/red]
width = 50%
height = 30
offset-x = 25%
offset-y = 4
bottom = true
fixed-center = true
radius = 0.0
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = FiraCode Nerd Font:size=10;2
modules-center = network
enable-ipc = true
wm-restack = bspwm

;=====================================================
; MÓDULOS
;=====================================================

[module/date]
type = internal/date
interval = 1
time = %H:%M
date = %a %d %b
label = %time% · %date%
label-foreground = ${colors.fg}
click-left = ~/.config/polybar/scripts/calendar.sh &

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/scripts/workspaces.sh
interval = 1
label = %output%
label-foreground = ${colors.fg}
click-left = ~/.config/polybar/scripts/workspaces_scroll.sh next
click-right = ~/.config/polybar/scripts/workspaces_scroll.sh prev
scroll-up = ~/.config/polybar/scripts/workspaces_scroll.sh prev
scroll-down = ~/.config/polybar/scripts/workspaces_scroll.sh next

[module/sysinfo]
type = custom/script
exec = ~/.config/polybar/scripts/sysinfo.sh
interval = 2
label = %output%
label-foreground = ${colors.fg}
click-left = ~/.config/polybar/scripts/sysinfo_scroll.sh next
click-right = ~/.config/polybar/scripts/sysinfo_scroll.sh prev
scroll-up = ~/.config/polybar/scripts/sysinfo_scroll.sh prev
scroll-down = ~/.config/polybar/scripts/sysinfo_scroll.sh next

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-volume-foreground = ${colors.fg}
label-muted = MUTE
label-muted-foreground = ${colors.alert}
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5
click-left = pamixer -t

[module/usb]
type = custom/script
exec = ~/.config/polybar/scripts/usb_devices.sh
interval = 2
label = %output%
label-foreground = ${colors.fg}
click-left = ~/.config/polybar/scripts/usb_scroll.sh next
click-right = ~/.config/polybar/scripts/usb_scroll.sh prev
scroll-up = ~/.config/polybar/scripts/usb_scroll.sh prev
scroll-down = ~/.config/polybar/scripts/usb_scroll.sh next

[module/tray]
type = internal/tray
tray-padding = 2
tray-spacing = 2
tray-maxsize = 22

[module/taskbar]
type = custom/script
exec = ~/.config/polybar/scripts/taskbar.sh
interval = 1
label = %output%
label-foreground = ${colors.fg}
click-left = ~/.config/polybar/scripts/taskbar_scroll.sh next
click-right = ~/.config/polybar/scripts/taskbar_scroll.sh prev
scroll-up = ~/.config/polybar/scripts/taskbar_scroll.sh prev
scroll-down = ~/.config/polybar/scripts/taskbar_scroll.sh next

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
label = %output%
label-foreground = ${colors.fg}
click-left = ~/.config/polybar/scripts/network_details.sh &
